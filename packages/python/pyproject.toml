[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "naija-pay"
version = "0.0.0"
description = "One typed interface to every Nigerian payment and banking-as-a-service provider: collections, virtual accounts, split payments, wallets, payouts and webhooks"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Akanji Oluwaseun Gabriel", email = "asgatcreation@gmail.com" }]
keywords = [
    "nigeria",
    "payments",
    "paystack",
    "flutterwave",
    "monnify",
    "fincra",
    "squad",
    "korapay",
    "virtual-accounts",
    "webhooks",
    "fintech",
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Financial",
    "Typing :: Typed",
]

# httpx is the only runtime dependency, by design.
dependencies = ["httpx>=0.27"]

[project.optional-dependencies]
django = []
drf = []
fastapi = []
flask = []

[project.urls]
Homepage = "https://github.com/asgatcreation/naija-pay"
Documentation = "https://github.com/asgatcreation/naija-pay#readme"
Source = "https://github.com/asgatcreation/naija-pay"
Issues = "https://github.com/asgatcreation/naija-pay/issues"
Changelog = "https://github.com/asgatcreation/naija-pay/blob/main/CHANGELOG.md"

[project.scripts]
naija-pay = "naija_pay.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/naija_pay"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_unreachable = true
disallow_any_explicit = false

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "A", "C4", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
