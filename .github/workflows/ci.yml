name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typescript:
    name: TypeScript (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Only 22 and 24 here, because these tests execute the TypeScript sources
        # directly and Node gained native type stripping in 22.18 / 23.6. The
        # PUBLISHED package supports Node 20+ — it ships compiled JavaScript — and the
        # `build` job below runs the compiled output on Node 20 to prove it rather than
        # assert it.
        node: ["22", "24"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      # No `npm ci` yet: the package has zero runtime dependencies and the dev
      # toolchain lands in milestone 3, so there is nothing to install. Tests run
      # on Node's built-in test runner against TypeScript sources directly.
      - name: Test
        run: npm test

  python:
    name: Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Test
        run: python -m unittest discover -s packages/python/tests -t packages/python -v

  parity:
    name: Cross-language parity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      # Runs the shared cases in fixtures/parity/ through BOTH packages and compares
      # the canonical JSON byte for byte. If the two languages ever disagree about an
      # amount, a split's rounding, a redacted string or why a value was refused, this
      # fails and names the case.
      - name: Core and version parity
        run: npm run test:parity

  generated-data:
    name: Generated data is current
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      # Validates the COMMITTED data offline: it parses, its counts match its contents,
      # its attribution is intact, and no two active institutions share a code.
      #
      # Deliberately does not regenerate from naija-data. Doing that would turn CI red
      # whenever naija-data ships a new bank, which is someone else's commit breaking
      # this build — the fastest way to get a useful check disabled. Upstream drift is
      # the weekly workflow's job, where it opens an issue instead.
      - name: Validate committed bank data
        run: npm run check:data

  typecheck:
    name: Typecheck (TypeScript)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - run: npm ci

      - name: tsc --noEmit
        run: npm run typecheck

  lint:
    name: Lint and format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - run: npm ci

      - name: Biome
        run: npm run lint

  build:
    name: Build, size and smoke (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 20 is the floor the published package declares. The sources cannot run there,
        # but the compiled output must, and this is what proves it.
        node: ["20", "24"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - run: npm ci

      # Built with Node 24 because tsup and tsc need a modern Node...
      - name: Build
        run: npm run build

      - name: Bundle size against budget
        run: npm run size

      # ...then the OUTPUT is exercised on the matrix version, which is the point.
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Smoke-test the built package
        run: node tools/smoke-dist.mjs

  python-quality:
    name: Lint and typecheck (Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      # Pinned so a new ruff or mypy release cannot fail an unrelated pull request.
      # Dependabot proposes the bumps instead.
      - name: Install the Python toolchain
        run: python -m pip install --quiet ruff==0.17.3 mypy==2.4.1 httpx

      - name: Ruff
        run: npm run lint:python

      - name: mypy --strict
        run: npm run typecheck:python

  hygiene:
    name: Repository hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: No committed .env
        run: |
          if git ls-files | grep -E '(^|/)\.env$|(^|/)\.env\.' | grep -v '\.env\.example$'; then
            echo "::error::an .env file is tracked by git; remove it and rotate the keys"
            exit 1
          fi
          echo "no .env files tracked"

      - name: No obvious live keys anywhere in the tree
        run: |
          # Live-key prefixes for the Tier 1 providers. Test keys are fine.
          #
          # Fake credentials in tests and fixtures must contain the literal token
          # EXAMPLE, and are ignored here. That keeps this check strong inside test
          # files too — which is exactly where a real key gets pasted by accident —
          # instead of excluding those paths wholesale. See CONTRIBUTING.md.
          if git grep -nIE 'sk_live_[A-Za-z0-9]|pk_live_[A-Za-z0-9]|FLWSECK-[A-Za-z0-9]|MK_PROD_[A-Za-z0-9]' \
               -- . ':!.github/workflows/ci.yml' | grep -v 'EXAMPLE'; then
            echo "::error::what looks like a live key is committed; rotate it immediately."
            echo "::error::If it is fake test data, put the token EXAMPLE in it."
            exit 1
          fi
          echo "no live key patterns found"

      - name: Required project files are present
        run: |
          for f in LICENSE README.md CONTRIBUTING.md SECURITY.md CODE_OF_CONDUCT.md \
                   CHANGELOG.md PROVIDERS.md DESIGN.md PLAN.md .env.example; do
            test -f "$f" || { echo "::error::missing $f"; exit 1; }
          done
          echo "all required files present"
